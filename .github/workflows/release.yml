name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.2.3 (leave empty to use the pubspec version)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Resolve version
        run: |
          PUB_VERSION="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)"
          VERSION_CODE="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f2)"
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::pubspec.yaml must include a build number, e.g. version: 1.2.5+23"
            exit 1
          fi
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="v$PUB_VERSION"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          if [ "$TAG" != "v$PUB_VERSION" ]; then
            echo "::error::tag $TAG does not match pubspec version $PUB_VERSION"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "building $TAG with versionCode $VERSION_CODE"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. Refusing to publish a debug-signed APK that cannot be upgraded."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.p12
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeType=PKCS12
          EOF
          chmod 600 android/upload-keystore.p12 android/key.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build APKs
        run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"

      - name: Verify APK signatures
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi
          for apk in build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$apk" ] || continue
            "$APKSIGNER" verify --print-certs "$apk" > /tmp/apk-certs.txt
            if ! grep -q "CN=FeatherStack" /tmp/apk-certs.txt; then
              echo "::error::unexpected signing certificate for $apk"
              cat /tmp/apk-certs.txt
              exit 1
            fi
            echo "verified: $apk"
          done

      - name: Build AAB
        run: |
          flutter build appbundle --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/MonoDash-${VERSION_NAME}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist/MonoDash-${VERSION_NAME}-${abi}.apk"
            fi
          done
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/MonoDash-${VERSION_NAME}.aab"
          ls -lh dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Resolve version
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="v$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f2)" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build unsigned app
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -qry "MonoDash-${VERSION_NAME}-ios-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa
          if-no-files-found: error

  windows:
    name: Windows x64 zip
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Resolve version
        shell: bash
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="v$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f2)" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows app
        run: |
          flutter build windows --release `
            --build-name="$env:VERSION_NAME" `
            --build-number="$env:VERSION_CODE"

      - name: Package zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem build\windows -Recurse -Filter onepanel_mate.exe | Select-Object -First 1
          if (-not $exe) { throw "onepanel_mate.exe not found" }
          $dir = $exe.Directory.FullName
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\MonoDash-$env:VERSION_NAME-windows-x64.zip" -Force
          Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="v$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mono Dash ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: artifacts/**/*
          fail_on_unmatched_files: true
